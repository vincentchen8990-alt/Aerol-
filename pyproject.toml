[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "personalized-gravity-ai"
version = "0.1.0"
description = "Research-only astronaut physiology catalogs and torque-limited rotating-spacecraft simulation"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.28", "numpy>=1.25", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.1", "PyYAML>=6", "joblib>=1.3", "requests>=2.31", "matplotlib>=3.7"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.setuptools.packages.find]
include = ["gravity_ai*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
